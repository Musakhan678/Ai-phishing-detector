# Optional Render Blueprint. Alternatively use the manual README instructions.
services:
  - type: web
    name: email-check
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FLASK_DEBUG
        value: "0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
